apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tienda-perritos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 734379326133.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:latest # <--- AGREGADO :latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: tienda-perritos
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80