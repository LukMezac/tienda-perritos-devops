apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tienda-perritos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 734379326133.dkr.ecr.us-east-1.amazonaws.com/tienda-backend:latest
        ports:
        - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: tienda-perritos
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 3001
    targetPort: 3001