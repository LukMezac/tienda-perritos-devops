name: Frontend CI/CD

on:
  push:
    branches:
      - deploy
    paths:
      - 'frontend/**'

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t frontend-image ./frontend
          docker tag frontend-image:latest ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest

      - name: Deploy EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker rm -f frontend-container || true

            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin 106867754749.dkr.ecr.us-east-1.amazonaws.com

            sudo docker pull 106867754749.dkr.ecr.us-east-1.amazonaws.com/tienda-perritos-frontend:latest

            sudo docker run -d -p 80:80 --name frontend-container 106867754749.dkr.ecr.us-east-1.amazonaws.com/tienda-perritos-frontend:latest